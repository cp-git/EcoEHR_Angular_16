<div class="main-content">
    <div class="container-fluid">
        <div class="wizard-container">
            <div class="card wizard-card" data-color="blue" id="wizardProfile">
                <div class="card-header" data-background-color>
                    <div class="row">
                        <div class="col-sm-6 col-md-5  col-xs-5">
                            <tr>
                                <td>
                                    <h6>Feedback Form</h6>
                                </td>
                            </tr>
                        </div>
                    </div>
                </div>

                <!-- <ngx-spinner bdColor="transparent" loadingText="Loading" size="defaut" color="#03659D" fullScreen="true" type="line-scale-pulse-out-rapid">
                    </ngx-spinner> -->
                    <div class="card-content ">
                        <div *ngIf="statusCode === 200" class="alert alert-success" data-icon-bg-color="alert-green">
                            <strong>Feedback submitted successfully!</strong>
                        </div>
                  

                
                    <form [formGroup]="contactUsForm" action="" method="">
                        <div class="row" style="margin-top: 45px;">
                            <div class="col-sm-3 col-md-4">
                                <div class="form-group label-floating">
                                    <label class="control-label">
                                        <small class="AsteriskColor">*</small> Subject
                                    </label>
                                    <input name="subject" type="subject" formControlName="subject" class="form-control" id="feedbackSubject">
                                    <!-- <ehr-field-error-display [displayError]="isFieldValid(contactUsForm, 'subject')"
                                        errorMsg="Enter valid subject">
                                    </ehr-field-error-display> -->
                                </div>
                            </div>
                        </div><br/>
                        <div class="row">
                            <div class="col-sm-12 col-md-9">
                                <label class="control-label">
                                    <small class="AsteriskColor">*</small> Description
                                </label><br/>
                                <textarea rows="4" cols="50" formControlName="description" ng-model="myTextarea"></textarea>
                                    <!-- <textarea type="text" name="description" formControlName="description" class="form-control "></textarea> -->
                                    <!-- <ehr-field-error-display [displayError]="isFieldValid(contactUsForm, 'description')"
                                        errorMsg="Enter valid description">
                                    </ehr-field-error-display>   -->
                            </div>

                        </div>
                        <br>
                        <div class="row">
                            <div>
                                <input type='button' class='btn button' name='SAVE' value='Submit Feedback' id="submitFeedback" (click)="sendEmail()" />
                                <input type='button' routerLink="/patients/patientlist" class='btn button pull-right' name='cancel' value="CANCEL">
                            </div>
                        </div>
                        <div class="clearfix"></div>


                  
                    </form>
                </div>


            </div>
        </div>
    </div>
</div>
